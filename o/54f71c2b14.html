<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>科幻废墟氛围</title>
<style>
 :root{--bg:#f6f7f9;--card:#fff;--line:#e6e8ec;--ink:#1c1f23;--dim:#6b7280;--accent:#2f6fed}
 *{box-sizing:border-box;-webkit-text-size-adjust:100%}
 body{margin:0;background:var(--bg);color:var(--ink);
      font:15px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
 header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);
        padding:14px 18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;z-index:2}
 h1{font-size:17px;margin:0;font-weight:700}
 h2{font-size:14px;margin:24px 0 10px;color:var(--dim);font-weight:600;letter-spacing:.02em}
 .meta{color:var(--dim);font-size:12.5px}
 main{padding:16px 16px 70px;max-width:1000px;margin:0 auto}
 a{color:var(--accent);text-decoration:none}
 .list{display:flex;flex-direction:column;gap:10px}
 .row{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:14px 16px;color:var(--ink)}
 .row:active{background:#f2f5ff}
 .row.done{opacity:.45}
 .row.done .need,.row.done .who{text-decoration:line-through;
       text-decoration-color:#9aa3af;text-decoration-thickness:1.5px}
 .row{transition:opacity .18s ease,transform .12s ease}
 .row{position:relative}
 .row .body{display:block;color:inherit;text-decoration:none}
 .row .chk{position:absolute;right:12px;bottom:12px;width:19px;height:19px;padding:0;
      border-radius:50%;border:1.5px solid #cfc7b6;background:#fff;cursor:pointer;
      transition:transform .12s ease,background .15s ease,border-color .15s ease}
 .row .chk:hover{transform:scale(1.12)}
 .row .chk:active{transform:scale(.92)}
 .row.done .chk{background:var(--accent);border-color:var(--accent)}
 .row.done .chk::after{content:'✓';color:#fff;font-size:12px;line-height:16px;display:block}
 .row:active{transform:scale(.995)}
 .row .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
 .row .who{font-weight:700;font-size:16px}
 .row .need{margin:6px 0 8px;font-size:14.5px}
 .row .bot{display:flex;gap:8px;flex-wrap:wrap;color:var(--dim);font-size:12.5px;align-items:center}
 .pill{display:inline-block;padding:2px 9px;border-radius:999px;background:#eef2ff;color:var(--accent);
       font-size:12px;white-space:nowrap}
 .pill.warn{background:#fff3e6;color:#b45309}
 .pill.ok{background:#e9f7ef;color:#137a45}
 .empty{padding:56px 18px;text-align:center;color:var(--dim);background:var(--card);
        border:1px dashed var(--line);border-radius:12px}
 .hero{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
 .hero .big{font-size:22px;font-weight:700;margin:2px 0 6px;line-height:1.35}
 .hero .sub{color:var(--dim);font-size:13px}
 .quote{margin:14px 0 0;padding:12px 14px;background:#fafbfc;border-left:3px solid var(--line);
        border-radius:6px;color:#3f4550;font-size:13.5px;white-space:pre-wrap}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
 .card{max-width:460px}.card video{width:100%;display:block;background:#000;border-radius:8px}.card img{width:100%;display:block;border-radius:8px}
 .card img{width:100%;display:block}
 .card .cap{padding:9px 12px;font-size:12.5px;color:var(--dim);word-break:break-all}
 .audio{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
 .audio audio{width:100%;margin-top:6px}
 .doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
 .note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:8px;font-size:14px}
 .note .s{display:block;color:var(--dim);font-size:12px;margin-bottom:4px}
 .back{display:inline-block;margin-bottom:12px;font-size:13.5px}
 .hello{background:linear-gradient(135deg,#fff,#f4f7ff);border:1px solid var(--line);
        border-radius:14px;padding:16px 18px;margin-bottom:14px}
 .hello .hi{font-size:17px;font-weight:700}
 .hello .poem{color:#4b5563;font-size:13.5px;margin:6px 0 12px;font-style:italic}
 .hello .stats{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#374151}
 .hello .stats b{font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
 .hello .stats .dim{color:var(--dim)}
 .hello{position:relative;overflow:hidden;display:flex;align-items:center;
   min-height:206px;background:linear-gradient(118deg,#fdfbf6 0%,#f7f2e7 58%,#f8ece8 100%)}
 .hello-txt{position:relative;z-index:2;flex:1;min-width:0;max-width:60%}
 .hello-art{position:absolute;right:0;top:0;bottom:0;width:380px;z-index:1}
 .hello-art .art{width:100%;height:100%;object-fit:cover;object-position:50% 47%;
   filter:brightness(.98) saturate(.94) contrast(.99);cursor:pointer;transform:scaleX(-1);
   -webkit-mask-image:linear-gradient(to right,rgba(0,0,0,0) 0%,#000 40%);
   mask-image:linear-gradient(to right,rgba(0,0,0,0) 0%,#000 40%)}
 .hello-art:after{content:'';position:absolute;inset:0;pointer-events:none;
   background:linear-gradient(90deg,rgba(247,242,231,.99) 0%,rgba(247,242,231,.55) 30%,
   rgba(247,242,231,.06) 68%,rgba(216,86,79,.05) 100%)}
 .hello-art .artcap{position:absolute;right:16px;bottom:12px;font-size:11px;color:#a08c78;
   letter-spacing:1px;writing-mode:vertical-rl;opacity:.85}
 .hello:before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
   background-image:radial-gradient(rgba(216,86,79,.14) 1px,transparent 1px);
   background-size:13px 13px;opacity:.5;
   -webkit-mask-image:linear-gradient(to left,transparent 28%,#000 96%);
   mask-image:linear-gradient(to left,transparent 28%,#000 96%)}
 .emptyface{display:flex;gap:16px;align-items:center;padding:24px 22px;background:var(--card);
   border:1px solid var(--line);border-radius:14px}
 .emptyface img{width:96px;height:96px;border-radius:16px;object-fit:cover;border:4px solid #fff;
   box-shadow:0 8px 18px rgba(120,90,70,.16);transform:rotate(-2deg);flex:none}
 /* 详情页：右侧整幅肖像 */
 .hero{position:relative;overflow:hidden;min-height:200px}
 .hero .portrait{position:absolute;right:0;top:0;height:100%;width:270px;object-fit:cover;
   object-position:50% 47%;filter:brightness(.98) saturate(.94);pointer-events:none;transform:scaleX(-1);
   -webkit-mask-image:linear-gradient(to right,rgba(0,0,0,0) 0%,#000 26%);
   mask-image:linear-gradient(to right,rgba(0,0,0,0) 0%,#000 26%)}
 .hero:after{content:'';position:absolute;right:0;top:0;height:100%;width:270px;pointer-events:none;
   background:linear-gradient(90deg,var(--card) 0%,rgba(255,253,248,.35) 22%,rgba(255,253,248,.02) 56%,rgba(216,86,79,.06) 100%)}
 .hero .sub,.hero .big,.hero .quote{position:relative;z-index:2;max-width:66%}
 /* 日历：左下角每月特写 + 渐变 */
 .cal{position:relative;overflow:hidden}
 .cal .calface{position:absolute;left:-10px;bottom:-14px;width:320px;opacity:.46;
   filter:brightness(1.03) saturate(.82) blur(.6px);pointer-events:none;
   -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 45%,transparent 82%);
   mask-image:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.35) 45%,transparent 82%)}
 .cal:after{content:'';position:absolute;inset:0;pointer-events:none;
   background:radial-gradient(circle at 6% 96%,rgba(216,86,79,.16),transparent 42%)}
 .cal .hd,.cal .day,.cal .dnum,.cal .dcount{position:relative;z-index:2}
 @media(max-width:640px){
   .hello{min-height:166px}
   .hello-art{width:230px}
   .hello-txt{max-width:70%}
   .hero .portrait,.hero:after{width:170px}
   .cal .calface{width:190px;opacity:.36}
   .emptyface img{width:72px;height:72px}
 }
 .ev{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;
     padding:10px 13px;margin-bottom:8px;font-size:13.5px;align-items:flex-start;line-height:1.55}
 .ev .k{font-size:11.5px;border-radius:999px;padding:1px 8px;white-space:nowrap;
        background:#eef2ff;color:var(--accent);flex:none}
 .ev .k.chg{background:#fff3e6;color:#b45309}
 .ev .k.nt{background:#f3f4f6;color:#6b7280}
 .ev .w{color:var(--dim);font-size:12px;white-space:nowrap;flex:none}
 .ev .x{flex:1;word-break:break-word}
 footer{color:var(--dim);font-size:12px;text-align:center;padding:30px 16px 50px}

 /* ---------------- 护眼配色（暖纸色 / 低对比 / 大行距） ---------------- */
 :root{--bg:#f2efe7;--card:#fcfaf5;--line:#e5ded0;--ink:#3d3a34;--dim:#8b8377;
       --accent:#6f8b6a;--warn:#b07d4f;--soft:#edf0e5;
       --shadow:0 8px 24px rgba(92,80,58,.07)}
 body{background:var(--bg);color:var(--ink);line-height:1.66;-webkit-font-smoothing:antialiased}
 header{background:rgba(252,250,245,.94);border-bottom:1px solid var(--line);
        backdrop-filter:saturate(1.05) blur(8px)}
 h1{font-family:"Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.02em}
 h2{color:#8b8377;font-family:"Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.03em}
 a{color:var(--accent)}
 .row{background:var(--card);border-color:var(--line);box-shadow:var(--shadow);border-radius:14px}
 .row:active{background:#f8f5ec;transform:scale(.995)}
 .row .who{color:var(--ink)}
 .row.done{opacity:.42}
 .pill{background:var(--soft);color:#5f7a5b}
 .pill.warn{background:#f6ece0;color:#a97243}
 .pill.ok{background:#e9f0e4;color:#5f7a5b}
 .empty,.hero,.card,.audio,.doc,.note{background:var(--card);border-color:var(--line)}
 .quote{background:#f7f4ea;border-left-color:#ddd3bf;color:#4c463c}
 .hello{background:linear-gradient(135deg,#fcfaf5,#eef1e5)}
 .hello .stats b{color:#6f8b6a}
 .ev .k{background:var(--soft);color:#5f7a5b}
 footer{color:#9a9384}

 /* ---------------- 新要求（置顶）/ 文件小条 / 另存为 / 日历 ---------------- */
 .reqbox{display:flex;flex-direction:column;gap:9px;margin-bottom:8px}
 .addreq{display:flex;gap:8px;margin:2px 0 18px}
 .hact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
 .hbtn{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;
      color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;transition:transform .12s ease,border-color .15s ease}
 .hbtn:hover{border-color:var(--accent);color:var(--accent)}
 .hbtn:active{transform:scale(.95)}
 .addfiles{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
 .upreq{display:flex;align-items:center;gap:12px;margin-top:4px}
 .upbtn{padding:9px 16px;border:1px dashed var(--accent);border-radius:10px;color:var(--accent);
      background:#fff;font-size:13.5px;cursor:pointer}
 .upbtn:hover{background:#f3f7f2}
 .upmsg{color:var(--dim);font-size:12.5px}
 .addreq .ai{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
      background:#fff;color:var(--ink);font:inherit;font-size:14px}
 .addreq .ai:focus{outline:none;border-color:var(--accent)}
 .addreq .ab{padding:10px 16px;border:1px solid var(--accent);border-radius:10px;background:var(--accent);
      color:#fff;font:inherit;font-size:14px;cursor:pointer;transition:transform .12s ease,opacity .15s ease}
 .addreq .ab:active{transform:scale(.96)}
 .req.new{animation:pop .35s cubic-bezier(.34,1.4,.64,1)}
 @keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.99)}to{opacity:1;transform:none}}
 .req{background:linear-gradient(135deg,#fdf6ea,#fbf3e4);border:1px solid #ecdfc6;
      border-left:3px solid var(--warn);border-radius:10px;padding:11px 13px}
 .req .rh{display:flex;gap:9px;align-items:center;font-size:12px;color:var(--dim);margin-bottom:5px}
 .req .rh .k.chg{background:#f7e3c8;color:#a2661f;font-size:11.5px;
      border-radius:999px;padding:1px 8px;white-space:nowrap}
 .req .rt{font-size:14.5px;line-height:1.62;word-break:break-word}
 .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
 .chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);
       border-radius:999px;padding:2px 10px;font-size:12.5px;color:var(--ink);max-width:100%;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .chip.sav{color:var(--accent)}
 .acts{display:flex;gap:8px;margin-top:8px}
 .sav{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:3px 10px;
      background:#fff;color:var(--accent);text-decoration:none}
 .nav{margin-bottom:12px;font-size:13.5px}
 .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);
      border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:20px}
 .cal .hd{font-size:12px;color:var(--dim);text-align:center;padding:4px 0}
 .cal .day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      min-height:54px;border-radius:10px;border:1px solid transparent;font-size:13px;color:var(--ink)}
 .cal .day.out{color:#c8cdd6}
 .cal .day.has{background:#eef2e6;border-color:#d7e3cc}
 .cal .day.today{border-color:var(--accent);background:#f3f6ec}
 .cal .dcount{font-size:11px;background:#7f9c74;color:#fff;border-radius:999px;padding:0 6px;line-height:16px}
.ract{margin-left:auto;display:flex;gap:6px;opacity:.5}

 .req:hover .ract{opacity:1}
 .ract button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:1px 8px;
      font:12px/1.7 inherit;cursor:pointer;color:var(--dim)}
 .ract .rdel:hover{color:#b4544a;border-color:#ecd3cd}
 .row.over{outline:2px dashed var(--accent);outline-offset:2px}
 .row.dragging{opacity:.4}
 #wcb_bar{position:fixed;left:16px;bottom:16px;z-index:50;display:none;gap:10px;align-items:center;
      background:var(--card);border:1px solid var(--line);border-radius:12px;
      box-shadow:var(--shadow);padding:9px 12px;font-size:13px;color:var(--dim)}
</style></head><body>
